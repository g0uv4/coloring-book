interface:
  display_name: Coloring Book
  short_description: Translate a photo into an Open-Line Plate coloring page (simple / medium / advanced). Show it first; compose an A4 PDF only after the user confirms.
  default_prompt: "Use $coloring-book on my uploaded photograph. Translate it into an Open-Line Plate coloring page at medium intensity, show me the plate, and wait for me to confirm a PDF or request edits."
